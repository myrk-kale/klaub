name: tmux asset

# Builds the pinned tmux for each release target and proves that a klaub binary with
# that tmux embedded can start, list and end a real session. Runs on pull requests
# that touch the pipeline, and is reused by the release workflow.

on:
  pull_request:
    paths:
      - scripts/build-tmux.sh
      - .github/workflows/tmux-asset.yml
      - crates/klaub-tmux/**
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build tmux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - name: Build tmux from pinned, hash-verified sources
        run: scripts/build-tmux.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: tmux-${{ matrix.target }}
          path: assets/tmux/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  verify:
    name: Embedded tmux works (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/download-artifact@v8.0.2
        with:
          name: tmux-${{ matrix.target }}
          path: assets/tmux/${{ matrix.target }}
      - run: cargo build --release --locked -p klaub-cli
      - name: Smoke test with the embedded tmux
        shell: bash
        run: |
          set -euo pipefail
          KLAUB_STATE_DIR="$(mktemp -d)"
          KLAUB_CACHE_DIR="$(mktemp -d)"
          KLAUB_CONFIG_DIR="$(mktemp -d)"
          export KLAUB_STATE_DIR KLAUB_CACHE_DIR KLAUB_CONFIG_DIR
          unset KLAUB_TMUX_PATH
          klaub=./target/release/klaub

          "$klaub" version
          "$klaub" doctor --format json | jq -e '.checks[] | select(.name == "tmux" and .status == "ok") | .detail | startswith("embedded")'

          out="$("$klaub" wrap --detach -- sh -c 'sleep 60')"
          id="$(printf '%s' "$out" | grep -o 'ses_[0-9a-f]*' | head -n 1)"
          "$klaub" session list --format json | jq -e --arg id "$id" '.[] | select(.id == $id and .state == "running")'
          "$klaub" session kill --yes "$id"

          # The extracted executable must not be writable by other users.
          if find "$KLAUB_CACHE_DIR/bin" -name tmux -perm -o+w | grep -q .; then
            echo "extracted tmux is world-writable" >&2
            exit 1
          fi
      - name: Diagnose a failed smoke test
        if: failure()
        shell: bash
        run: |
          set +e
          uname -a
          tmuxbin="$(find "${KLAUB_CACHE_DIR:-/nonexistent}" "$RUNNER_TEMP" "$HOME/Library/Caches" "$HOME/.cache" -name tmux -type f 2>/dev/null | head -n 1)"
          echo "tmux: $tmuxbin"
          dir="$(mktemp -d)"
          gzip -dc assets/tmux/${{ matrix.target }}/tmux.gz > "$dir/tmux"; chmod +x "$dir/tmux"
          file "$dir/tmux"; "$dir/tmux" -V
          "$dir/tmux" -S "$dir/sock" -f /dev/null new-session -d -s probe 'sleep 60'; echo "new-session exit=$?"
          "$dir/tmux" -S "$dir/sock" list-sessions; echo "list exit=$?"
          sleep 1
          "$dir/tmux" -S "$dir/sock" list-sessions; echo "list again exit=$?"
          "$dir/tmux" -S "$dir/sock" kill-server
          sleep 8
          ls -la "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | tail -n 5
          for report in "$HOME"/Library/Logs/DiagnosticReports/.tmux-*.ips "$HOME"/Library/Logs/DiagnosticReports/tmux-*.ips; do
            [ -f "$report" ] || continue
            echo "=== $report"
            python3 - "$report" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          body = text.split("\n", 1)[1] if text.startswith("{") and "\n" in text else text
          try:
              data = json.loads(body)
          except Exception:
              print(text[:3000]); raise SystemExit
          print("exception:", data.get("exception"))
          print("termination:", data.get("termination"))
          print("asi:", data.get("asi"))
          images = data.get("usedImages", [])
          threads = data.get("threads", [])
          ft = data.get("faultingThread", 0)
          for t in [threads[ft]] if threads and ft < len(threads) else []:
              for f in t.get("frames", [])[:20]:
                  img = images[f["imageIndex"]].get("name") if "imageIndex" in f else "?"
                  print("  ", img, f.get("symbol"), f.get("symbolLocation"), f.get("imageOffset"))
          print("crashing thread state keys:", [k for k in (threads[ft] if threads else {}).keys()])
          PY
          done
      - name: Dynamic dependencies of the embedded tmux
        run: cat assets/tmux/${{ matrix.target }}/dependencies.txt
