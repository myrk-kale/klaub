name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The two extra runners cover Linux on aarch64 and macOS on Intel.
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm, macos-15-intel]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Install tmux (integration tests drive a real tmux server)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tmux
          else
            brew install tmux
          fi
          tmux -V
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "Klaub CI"
          git config --global user.email "ci@klaub.invalid"
          git config --global init.defaultBranch main
      - run: cargo test --all-features --locked

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo doc --no-deps --all-features --locked

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo check --all-targets --all-features --locked

  deny:
    name: Licenses, bans and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check bans licenses sources

  typos:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: crate-ci/typos@v1.51.1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-llvm-cov
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Configure git identity for fixture repositories
        run: |
          git config --global user.name "Klaub CI"
          git config --global user.email "ci@klaub.invalid"
          git config --global init.defaultBranch main
      - name: Measure coverage
        run: cargo llvm-cov --all-features --locked --lcov --output-path lcov.info
      - name: Summarise coverage
        run: |
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  package:
    name: Packages for crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      # Builds the crate from the archive that would be uploaded, so a file that only exists
      # in the repository (an include_str! of a path outside the crate, say) fails here and not
      # on release day.
      - run: cargo package --locked

  skills:
    name: Skills are installable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The Vercel skills CLI finds both skills
        shell: bash
        run: |
          npx -y skills@1 add . --list 2>&1 | sed 's/\x1b\[[0-9;]*m//g' > skills.txt
          cat skills.txt
          grep -q "Found 2 skills" skills.txt
          grep -q "klaub-flow" skills.txt
          grep -q "klaub-feedback" skills.txt

  # A single required check for branch protection, independent of the matrix shape.
  ci-success:
    name: CI success
    if: always()
    needs: [fmt, clippy, test, docs, msrv, deny, typos, coverage, package, skills]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed"; exit 1
          fi
