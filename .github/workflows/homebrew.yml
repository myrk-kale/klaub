name: Homebrew

# Publishes Formula/klaub.rb to myrk-kale/homebrew-tap for a released version, so that
# `brew install myrk-kale/tap/klaub` installs it. Called by the release workflow (a release created
# with GITHUB_TOKEN does not trigger `release` events) and runnable by hand for any existing tag.
#
# Needs the secret HOMEBREW_TAP_DEPLOY_KEY: the private half of a deploy key with write access
# registered on myrk-kale/homebrew-tap (see RELEASING.md).
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.4.0)
        required: true

permissions:
  contents: read

jobs:
  tap:
    name: Update the tap
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/checkout@v7.0.1
        with:
          repository: myrk-kale/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Render the formula from the release checksums
        run: |
          version="${TAG#v}"
          sha() {
            archive="klaub-${version}-$1.tar.gz"
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "${archive}.sha256" -D dist --clobber
            cut -d' ' -f1 "dist/${archive}.sha256"
          }
          mkdir -p tap/Formula
          packaging/render-formula.sh "$version" \
            "$(sha aarch64-apple-darwin)" \
            "$(sha x86_64-apple-darwin)" \
            "$(sha aarch64-unknown-linux-gnu)" \
            "$(sha x86_64-unknown-linux-gnu)" > tap/Formula/klaub.rb
          cat tap/Formula/klaub.rb
      - name: Audit, install and test
        run: |
          brew tap-new --no-git local/verify >/dev/null
          brew trust local/verify 2>/dev/null || true
          cp tap/Formula/klaub.rb "$(brew --repository local/verify)/Formula/"
          brew audit --strict --online local/verify/klaub
          brew install local/verify/klaub
          brew test local/verify/klaub
      - name: Push to the tap
        run: |
          cd tap
          git config user.name "klaub release bot"
          git config user.email "klaub-release@users.noreply.github.com"
          git add Formula/klaub.rb
          if git diff --cached --quiet; then echo "formula unchanged"; exit 0; fi
          git commit -m "klaub ${TAG#v}"
          git push
