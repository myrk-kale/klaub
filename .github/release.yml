# Categories used by GitHub's generated release notes.
changelog:
  exclude:
    labels: [skip-changelog]
    authors: [dependabot]
  categories:
    - title: "Breaking changes"
      labels: [breaking]
    - title: "Features"
      labels: [enhancement, feature]
    - title: "Fixes"
      labels: [bug]
    - title: "Security"
      labels: [security]
    - title: "Documentation"
      labels: [documentation]
    - title: "Maintenance"
      labels: ["*"]
