name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Run `klaub doctor` and paste its output below; it contains no code or comments from your repository.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal sequence of commands, ideally against a small public repository.
      placeholder: |
        1. klaub wrap -- ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`klaub doctor` output"
      render: text
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal emulator and harness
      placeholder: "Ghostty 1.x, Codex CLI 0.x"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Run with `KLAUB_LOG=debug`. Remove anything private."
      render: text
