version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # The ref of this action is the Rust version the MSRV job installs (`@1.90.0`). Bumping it
      # would make that job stop proving the minimum version. Raise the MSRV on purpose, in
      # Cargo.toml and in ci.yml together.
      - dependency-name: "dtolnay/rust-toolchain"
