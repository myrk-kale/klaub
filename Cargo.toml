[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/myrk-kale/klaub"
homepage = "https://github.com/myrk-kale/klaub"
documentation = "https://github.com/myrk-kale/klaub/tree/main/docs"
authors = ["The Klaub contributors"]
keywords = ["code-review", "tui", "tmux", "tree-sitter", "git"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Shared third-party dependencies are declared here and inherited by member
# crates with `dep.workspace = true`, so a version is bumped in exactly one place.
anyhow = "1.0"
assert_cmd = "2.2"
predicates = "3.1"
blake3 = "1.8"
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
proptest = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "1.1"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
similar = "3.2"
petgraph = "0.8"
quick-xml = "0.42"
rusqlite = { version = "0.41", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
flate2 = "1.1"
uuid = { version = "1.18", features = ["v4"] }
ratatui = "0.30"
clap_complete = "4.6"

# Workspace-internal crates.
klaub-core = { path = "crates/klaub-core", version = "0.1.0" }
klaub-git = { path = "crates/klaub-git", version = "0.1.0" }
klaub-graph = { path = "crates/klaub-graph", version = "0.1.0" }
klaub-rules = { path = "crates/klaub-rules", version = "0.1.0" }
klaub-review = { path = "crates/klaub-review", version = "0.1.0" }
klaub-context = { path = "crates/klaub-context", version = "0.1.0" }
klaub-tests = { path = "crates/klaub-tests", version = "0.1.0" }
klaub-flow = { path = "crates/klaub-flow", version = "0.1.0" }
klaub-storage = { path = "crates/klaub-storage", version = "0.1.0" }
klaub-app = { path = "crates/klaub-app", version = "0.1.0" }
klaub-match = { path = "crates/klaub-match", version = "0.1.0" }
klaub-parse = { path = "crates/klaub-parse", version = "0.1.0" }
klaub-tmux = { path = "crates/klaub-tmux", version = "0.1.0" }
klaub-tui = { path = "crates/klaub-tui", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code reports failures through `Result`; panics are reserved for tests.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic lints that cost more readability than they buy in this code base.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
format_push_string = "allow"
struct_field_names = "allow"
single_match_else = "allow"
semicolon_if_nothing_returned = "allow"
redundant_closure_for_method_calls = "allow"
# `assert!(x.is_empty())` reads better in tests than `assert_eq!(x, [])`.
assert_is_empty = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
# Dependencies (tree-sitter grammars, SQLite) are slow to run unoptimised.
[profile.dev.package."*"]
opt-level = 1
