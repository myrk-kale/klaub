[package]
name = "klaub"
description = "Klaub: a terminal code reviewer for AI coding agents. Review changes by function, ranked by risk, offline and with no LLM."
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/myrk-kale/klaub"
homepage = "https://github.com/myrk-kale/klaub"
documentation = "https://github.com/myrk-kale/klaub/tree/main/docs"
readme = "README.md"
authors = ["The Klaub contributors"]
keywords = ["code-review", "ai-agents", "git", "tree-sitter", "cli"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"
exclude = [
    ".github/",
    "skills/",
    "packaging/",
    "scripts/",
    "assets/",
    "docs/",
    "justfile",
    "deny.toml",
    "typos.toml",
]

[lib]
name = "klaub"
path = "src/lib.rs"

[[bin]]
name = "klaub"
path = "src/main.rs"

[features]
# Helpers that build throwaway Git repositories and a fixed clock for tests and benches.
# Enabled for them through the self dev-dependency below; never needed by users.
testing = ["dep:tempfile"]

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "1.1"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
similar = "3.2"
petgraph = "0.8"
quick-xml = "0.42"
rusqlite = { version = "0.41", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.11"
flate2 = "1.1"
uuid = { version = "1.18", features = ["v4"] }
ratatui = "0.30"
unicode-width = "0.2"
clap_complete = "4.6"
tempfile = { version = "3.27", optional = true }

[dev-dependencies]
klaub = { path = ".", features = ["testing"] }
assert_cmd = "2.2"
predicates = "3.1"
proptest = "1.12"
tempfile = "3.27"

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "ui"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code reports failures through `Result`; panics are reserved for tests.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic lints that cost more readability than they buy in this code base.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
format_push_string = "allow"
struct_field_names = "allow"
single_match_else = "allow"
semicolon_if_nothing_returned = "allow"
redundant_closure_for_method_calls = "allow"
# `assert!(x.is_empty())` reads better in tests than `assert_eq!(x, [])`.
assert_is_empty = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
# Dependencies (tree-sitter grammars, SQLite) are slow to run unoptimised.
[profile.dev.package."*"]
opt-level = 1
