[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/myrk-kale/klaub"
homepage = "https://github.com/myrk-kale/klaub"
documentation = "https://github.com/myrk-kale/klaub/tree/main/docs"
authors = ["The Klaub contributors"]
keywords = ["code-review", "tui", "tmux", "tree-sitter", "git"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
# Shared third-party dependencies are declared here and inherited by member
# crates with `dep.workspace = true`, so a version is bumped in exactly one place.
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }

# Workspace-internal crates are added here as they are introduced.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Library code reports failures through `Result`; panics are reserved for tests.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
# Pedantic lints that cost more readability than they buy in this code base.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
# Dependencies (tree-sitter grammars, SQLite) are slow to run unoptimised.
[profile.dev.package."*"]
opt-level = 1
